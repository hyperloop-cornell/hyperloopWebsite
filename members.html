<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cornell Hyperloop — Members</title>
<link rel="stylesheet" href="res/tw.css"/>
<style>
  @font-face{font-family:'Material Symbols Outlined';src:url('res/fonts/material-symbols-outlined.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:'Inter';src:url('res/fonts/Inter/Inter-VariableFont_opsz,wght.subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
  @font-face{font-family:'Inter';src:url('res/fonts/Inter/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
  @font-face{font-family:'Space Grotesk';src:url('res/fonts/Space_Grotesk/SpaceGrotesk-VariableFont_wght.subset.woff2') format('woff2');font-weight:300 700;font-style:normal;font-display:swap}
  .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24 }
  .grid-overlay {
    background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  html,body{background:#0c1324;color:#dce1fb;overflow-x:hidden}
  .member-photo { transition: transform 0.4s ease; }
  .group:hover .member-photo { transform: scale(1.04); }
  .img-skeleton { background: linear-gradient(90deg, #151b2d 25%, #23293c 50%, #151b2d 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }
</style>
</head>
<body class="bg-background text-on-background font-body-md text-body-md overflow-x-hidden">
<div id="nav-placeholder"></div>

<main>
  <!-- Page Header -->
  <section class="relative py-20 md:py-32 border-b border-outline-variant overflow-hidden">
    <div class="grid-overlay absolute inset-0 opacity-30"></div>
    <div class="absolute inset-0 z-0">
      <img src="res/teamPhoto.jpg" alt="Cornell Hyperloop team" class="w-full h-full object-cover opacity-30" loading="lazy" decoding="async"/>
      <div class="absolute inset-0 bg-gradient-to-r from-background via-background/80 to-background/40"></div>
    </div>
    <div class="relative z-10 max-w-container-max mx-auto px-6 md:px-margin">
      <div class="border-l-2 border-primary-container pl-8">
        <span class="font-label-caps text-label-caps text-primary tracking-[0.2em] uppercase flex items-center gap-2 mb-4">
          <span class="w-8 h-[1px] bg-primary block"></span>Personnel
        </span>
        <h1 class="font-headline-xl text-headline-xl text-on-surface uppercase tracking-tighter mb-4" style="font-size:clamp(1.75rem,10vw,4rem)">The Roster</h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl">
          Engineers, designers, and strategists. The core unit driving Cornell Hyperloop's mechanical excellence and velocity-focused innovation.
        </p>
      </div>
    </div>
  </section>

  <!-- Faculty Advisors -->
  <section class="py-20 border-b border-outline-variant">
    <div class="max-w-container-max mx-auto px-margin">
      <div class="flex items-center gap-4 mb-10">
        <h2 class="font-headline-md text-headline-md text-on-surface uppercase tracking-tight whitespace-nowrap">Faculty Advisors</h2>
        <div class="h-px bg-outline-variant flex-grow opacity-50"></div>
        <span class="font-label-caps text-label-caps text-on-surface-variant uppercase whitespace-nowrap">FAC-00</span>
      </div>
      <div id="faculty" class="grid grid-cols-1 md:grid-cols-2 gap-gutter"></div>
    </div>
  </section>

  <!-- Team Leads -->
  <section class="py-20 border-b border-outline-variant">
    <div class="max-w-container-max mx-auto px-margin">
      <div class="flex items-center gap-4 mb-10">
        <h2 class="font-headline-md text-headline-md text-primary uppercase tracking-tight whitespace-nowrap">Leads</h2>
        <div class="h-px bg-outline-variant flex-grow opacity-50"></div>
        <span class="font-label-caps text-label-caps text-on-surface-variant uppercase whitespace-nowrap">LDR-01</span>
      </div>
      <div id="team-leads" class="grid grid-cols-1 md:grid-cols-2 gap-gutter"></div>
    </div>
  </section>

  <!-- Subteam Leads -->
  <section class="py-20 border-b border-outline-variant">
    <div class="max-w-container-max mx-auto px-margin">
      <div class="flex items-center gap-4 mb-10">
        <h2 class="font-headline-md text-headline-md text-on-surface uppercase tracking-tight whitespace-nowrap">Subteam Leads</h2>
        <div class="h-px bg-outline-variant flex-grow opacity-50"></div>
        <span class="font-label-caps text-label-caps text-on-surface-variant uppercase whitespace-nowrap">LDR-02</span>
      </div>
      <div id="subteam-leads" class="grid grid-cols-2 md:grid-cols-3 gap-gutter"></div>
    </div>
  </section>

  <!-- Members by Subteam -->
  <section class="py-20">
    <div class="max-w-container-max mx-auto px-margin">
      <div class="flex items-center gap-4 mb-10">
        <h2 class="font-headline-md text-headline-md text-on-surface uppercase tracking-tight whitespace-nowrap">Active Roster</h2>
        <div class="h-px bg-outline-variant flex-grow opacity-50"></div>
        <span class="font-label-caps text-label-caps text-on-surface-variant uppercase whitespace-nowrap">RST-03</span>
      </div>
      <div id="members-by-subteam" class="space-y-16"></div>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>
<script src="shared.js"></script>
<script>
const PHOTO_BASE = "res/compressed_teamPhotos/";

function cardWrapper(person, inner) {
  const tag = person.linkedin ? "a" : "div";
  const attrs = person.linkedin
    ? `href="${person.linkedin}" target="_blank" rel="noopener noreferrer"`
    : "";
  return `<${tag} ${attrs} class="group relative bg-surface-container-low border border-surface-variant flex flex-col overflow-hidden hover:border-primary/50 transition-colors duration-300 cursor-pointer">${inner}</${tag}>`;
}

function leadCard(person) {
  return cardWrapper(person, `
    <div class="absolute inset-0 overflow-hidden">
      <img src="${PHOTO_BASE}${person.photo}" alt="${person.name}" loading="lazy" decoding="async"
           class="member-photo w-full h-full object-cover object-top" style="height:480px"/>
    </div>
    <div class="h-[480px] relative">
      <div class="absolute inset-0 bg-gradient-to-t from-surface from-20% via-surface/75 to-transparent"></div>
      <div class="absolute inset-0 border-2 border-transparent group-hover:border-primary/50 transition-colors pointer-events-none"></div>
      <div class="absolute bottom-0 left-0 right-0 p-6 flex flex-col gap-2">
        <div class="flex items-center gap-2">
          <span class="w-5 h-[2px] bg-primary-container block"></span>
          <span class="font-label-caps text-[10px] text-primary uppercase tracking-widest">${person.role}</span>
        </div>
        <h3 class="font-headline-lg text-headline-lg text-on-surface uppercase group-hover:text-primary transition-colors leading-none">${person.name}</h3>
      </div>
    </div>`);
}

function subteamLeadCard(person) {
  return cardWrapper(person, `
    <div class="absolute inset-0 overflow-hidden">
      <img src="${PHOTO_BASE}${person.photo}" alt="${person.name}" loading="lazy" decoding="async"
           class="member-photo w-full h-full object-cover object-top" style="height:360px"/>
    </div>
    <div class="h-[360px] relative">
      <div class="absolute inset-0 bg-gradient-to-t from-surface from-20% via-surface/70 to-transparent"></div>
      <div class="absolute inset-0 border-2 border-transparent group-hover:border-primary/50 transition-colors pointer-events-none"></div>
      <div class="absolute bottom-0 left-0 right-0 p-5 flex flex-col gap-1">
        <div class="flex items-center gap-2">
          <span class="w-4 h-[2px] bg-primary-container block"></span>
          <span class="font-label-caps text-[10px] text-primary uppercase tracking-widest">${person.subteam} · ${person.role}</span>
        </div>
        <h3 class="font-headline-md text-[18px] text-on-surface uppercase group-hover:text-primary transition-colors leading-tight">${person.name}</h3>
      </div>
    </div>`);
}

function memberCard(person) {
  return `
  <div class="group relative bg-surface-container-low border border-surface-variant flex flex-col h-[260px] overflow-hidden hover:border-primary/50 transition-all duration-300">
    <div class="absolute inset-0 overflow-hidden">
      <img src="${PHOTO_BASE}${person.photo}" alt="${person.name}" loading="lazy" decoding="async"
           class="member-photo w-full h-full object-cover object-top"/>
    </div>
    <div class="absolute inset-0 bg-gradient-to-t from-surface from-10% via-surface/60 to-transparent"></div>
    <div class="relative z-10 flex flex-col justify-end h-full p-4 gap-1">
      <div class="flex items-center gap-2">
        <span class="w-3 h-[2px] bg-primary-container block"></span>
        <span class="font-label-caps text-[9px] text-primary uppercase tracking-widest">${person.subteam}</span>
      </div>
      <h4 class="font-headline-md text-[15px] text-on-surface uppercase group-hover:text-primary transition-colors leading-tight">${person.name}</h4>
    </div>
  </div>`;
}

function facultyCard(person) {
  return cardWrapper(person, `
    <div class="absolute inset-0 overflow-hidden">
      <img src="${PHOTO_BASE}${person.photo}" alt="${person.name}" loading="lazy" decoding="async"
           class="member-photo w-full h-full object-cover object-top" style="height:380px"/>
    </div>
    <div class="h-[380px] relative">
      <div class="absolute inset-0 bg-gradient-to-t from-surface from-20% via-surface/75 to-transparent"></div>
      <div class="absolute inset-0 border-2 border-transparent group-hover:border-secondary/50 transition-colors pointer-events-none"></div>
      <div class="absolute bottom-0 left-0 right-0 p-6 flex flex-col gap-2">
        <div class="flex items-center gap-2">
          <span class="w-5 h-[2px] bg-secondary block"></span>
          <span class="font-label-caps text-[10px] text-secondary uppercase tracking-widest">${person.role} · ${person.department}</span>
        </div>
        <h3 class="font-headline-lg text-headline-lg text-on-surface uppercase group-hover:text-secondary transition-colors leading-none">${person.name}</h3>
      </div>
    </div>`);
}

fetch("res/members.json")
  .then(r => r.json())
  .then(data => {
    // Faculty
    document.getElementById("faculty").innerHTML =
      data.faculty.map(facultyCard).join("");

    // Team leads
    document.getElementById("team-leads").innerHTML =
      data.teamLeads.map(leadCard).join("");

    // Subteam leads
    document.getElementById("subteam-leads").innerHTML =
      data.subteamLeads.map(subteamLeadCard).join("");

    // Group members by subteam
    const grouped = {};
    data.members.forEach(m => {
      if (!grouped[m.subteam]) grouped[m.subteam] = [];
      grouped[m.subteam].push(m);
    });

    const container = document.getElementById("members-by-subteam");
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        observer.unobserve(entry.target);
        const { subteam, members } = entry.target._data;
        entry.target.innerHTML = `
          <div class="flex items-center gap-4 mb-6">
            <span class="font-label-caps text-label-caps text-primary uppercase tracking-[0.15em]">${subteam}</span>
            <div class="h-px bg-outline-variant flex-grow opacity-40"></div>
            <span class="font-mono text-xs text-on-surface-variant opacity-40">${String(members.length).padStart(2,"0")} members</span>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            ${members.map(memberCard).join("")}
          </div>`;
      });
    }, { rootMargin: "200px" });

    Object.entries(grouped).forEach(([subteam, members]) => {
      const section = document.createElement("div");
      const cardHeight = 260;
      const rows = Math.ceil(members.length / 5);
      section.style.minHeight = (rows * cardHeight + 80) + "px";
      section.innerHTML = `<div class="flex items-center gap-4 mb-6"><span class="font-label-caps text-label-caps text-primary uppercase tracking-[0.15em]">${subteam}</span><div class="h-px bg-outline-variant flex-grow opacity-40"></div></div><div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">${members.map(() => `<div class="img-skeleton h-[260px]"></div>`).join("")}</div>`;
      section._data = { subteam, members };
      observer.observe(section);
      container.appendChild(section);
    });
  });
</script>
</body>
</html>
